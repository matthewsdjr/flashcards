server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La app usa HashRouter, asi que basta con devolver siempre index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre, se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El HTML nunca se cachea para que un deploy nuevo se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
