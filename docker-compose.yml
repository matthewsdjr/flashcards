services:
  flashcards:
    build:
      context: .
      args:
        # Raiz del dominio. Cambialo si la servis desde un subdirectorio.
        BASE_PATH: /
    image: flashcards:latest
    container_name: flashcards
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
